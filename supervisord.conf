; Supervisor 主配置文件。
; Supervisor 配置文件使用分号（;）表示注释。
; 本配置让 sshd、PostgreSQL 16、OpenCode、DeepSeek Harness、
; dsh 的端口代理、Kimi Code Web 以及可选的 NocoBase 执行机
; 在同一个容器内以前台子进程方式运行，
; 并提供进程状态查看、日志转发和异常自动重启能力。

[unix_http_server]
; 创建 supervisorctl 使用的本地 Unix Socket。
; 该 Socket 仅能在容器内访问，不会直接暴露 TCP 管理端口。
file=/run/supervisor.sock

[supervisord]
; 以前台模式运行，不让 supervisord 自己转入后台。
; Docker 容器需要主进程一直位于前台，否则容器会立即退出。
nodaemon=true

; supervisord 及其子进程以 root 身份运行。
; 本镜像不创建 dsh 或其他额外 Linux 用户，
; sshd、OpenCode 和 DeepSeek Harness 都直接使用 root。
user=root

; supervisord 自身的日志写入 /dev/null。
; 六个内置服务的日志仍分别转发到 Docker 标准输出和标准错误；
; 可选的 nocobase-runner 由独立的包装脚本管理，日志同样转发到 Docker。
logfile=/dev/null

; 0 表示不对 supervisord 自身日志执行按大小轮转。
logfile_maxbytes=0

; supervisord 主进程的 PID 文件位置。
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
; 启用 Supervisor 的本地 RPC 接口，使 supervisorctl 能查询和控制子进程。
; 例如：supervisorctl -c /etc/supervisor/supervisord.conf status
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
; supervisorctl 通过上面定义的 Unix Socket 连接 supervisord。
serverurl=unix:///run/supervisor.sock

[program:sshd]
; -D：让 sshd 保持前台运行，便于 Supervisor 监控其生命周期。
; -e：将 sshd 日志写入标准错误，最终可由 docker compose logs 查看。
command=/usr/sbin/sshd -D -e

; 启动优先级为 10，低于其他服务的 15、20、30、40、50，
; 因此通常最先启动 SSH。
; 停止顺序与启动顺序相反，数值较小的服务较后停止。
priority=10

; supervisord 启动时自动启动 sshd。
autostart=true

; sshd 退出后自动重启，无论退出码是否表示正常退出。
autorestart=true

; sshd 启动后持续运行至少 5 秒，才被视为成功进入 RUNNING 状态。
startsecs=5

; 将 sshd 标准输出转发到容器标准输出。
stdout_logfile=/dev/fd/1

; 0 表示不轮转该输出；直接交给 Docker 的日志驱动处理。
stdout_logfile_maxbytes=0

; 将 sshd 标准错误转发到容器标准错误。
stderr_logfile=/dev/fd/2

; 不对标准错误进行本地文件轮转。
stderr_logfile_maxbytes=0

[program:postgres]
; 启动 PostgreSQL 16。
; 包装脚本负责首次 initdb、后续复用持久化数据，并以前台方式运行 postgres。
; 运行时环境变量由 Compose 继承：
; - POSTGRES_USER：数据库超级用户，默认 postgres。
;   POSTGRES_PASSWORD：首次初始化时设置该用户密码。
; - PGDATA 默认 /var/lib/postgresql/data，对应持久化挂载目录。
; 注意：用户名和密码只在首次初始化时生效；之后修改 Compose 不会改已有数据库密码。
command=/usr/local/bin/start-postgres.sh

; 数据目录和运行目录均由脚本处理，这里使用项目工作区作为通用工作目录。
directory=/workspaces

; 优先级 15：在 SSH 之后、OpenCode 等应用服务之前启动数据库。
priority=15

; 容器启动时自动启动 PostgreSQL。
autostart=true

; PostgreSQL 退出后自动重启；如果配置损坏，Supervisor 会持续尝试并记录日志。
autorestart=true

; 持续运行至少 10 秒才视为启动成功，给首次 initdb 和恢复操作预留时间。
startsecs=10

; 连续启动失败 5 次后进入 FATAL 状态，便于通过 supervisorctl 排查。
startretries=5

; 停止时向整个进程组发送信号，确保 postgres 及其子进程一起停止。
stopasgroup=true

; PostgreSQL 对 SIGTERM 执行 smart shutdown（等待客户端主动断开），
; 对 SIGINT 执行 fast shutdown（断开客户端并立即完成检查点）。
; 使用 SIGINT 避免容器停止时长时间等待，同时保持数据库正常关闭。
stopsignal=INT

; 给 fast shutdown 充足时间完成检查点；超时后 Supervisor 才会强杀。
stopwaitsecs=60

; 停止超时后强制终止整个进程组，避免遗留数据库进程。
killasgroup=true

; 将 PostgreSQL 标准输出转发到容器标准输出。
stdout_logfile=/dev/fd/1

; 不使用本地日志轮转，由 Docker 日志驱动统一管理。
stdout_logfile_maxbytes=0

; 将 PostgreSQL 标准错误转发到容器标准错误。
stderr_logfile=/dev/fd/2

; 不对标准错误进行本地文件轮转。
stderr_logfile_maxbytes=0

[program:opencode]
; 启动 OpenCode v2 的前台 HTTP 服务。
; --hostname 0.0.0.0：监听所有容器网卡，允许宿主机端口映射访问。
; --port 49374：容器内部端口，与 Dockerfile EXPOSE 一致；
; 宿主机通过 2225:49374 映射访问。
; OPENCODE_PASSWORD 不需要写在命令行中，子进程会继承 Compose 传入的运行时环境变量。
command=/usr/local/bin/opencode serve --hostname 0.0.0.0 --port 49374

; 启动服务前切换到项目目录，使 OpenCode 默认在持久化工作区中操作。
directory=/workspaces

; 优先级高于 sshd 和 postgres，因此通常在它们之后启动、之前停止。
priority=20

; supervisord 启动时自动启动 OpenCode。
autostart=true

; OpenCode 意外退出或正常退出后都自动拉起，适合长期运行的开发容器。
autorestart=true

; 持续运行至少 10 秒才视为启动成功，给 Web 服务预留初始化时间。
startsecs=10

; 如果进程在 startsecs 指定时间内退出，最多连续尝试启动 5 次。
; 多次失败后服务会进入 FATAL 状态，可通过 supervisorctl 和容器日志排查。
startretries=5

; 停止 OpenCode 时，将停止信号发送给其整个进程组，包括它创建的子进程。
stopasgroup=true

; 如果停止超时后必须强制终止，也向整个进程组发送强制终止信号，
; 避免遗留孤儿子进程。
killasgroup=true

; 将 OpenCode 标准输出转发到容器标准输出。
stdout_logfile=/dev/fd/1

; 不使用 Supervisor 本地日志轮转，由 Docker 日志驱动统一管理。
stdout_logfile_maxbytes=0

; 将 OpenCode 标准错误转发到容器标准错误。
stderr_logfile=/dev/fd/2

; 不对标准错误进行本地文件轮转。
stderr_logfile_maxbytes=0

[program:dsh]
; 启动 DeepSeek Harness Web。
; dsh 不允许 --host 0.0.0.0，因此不能直接写在这里。
; 包装脚本让 dsh 只绑定容器回环地址 127.0.0.1:3081，
; 容器内的 0.0.0.0:3080 由下面的 dsh-proxy 转发，
; 宿主机通过 2224:3080 映射对外提供访问。
; 包装脚本读取下列运行时环境变量：
; - DSH_HOME=/root/.dsh
; - DSH_PUBLIC_URL：只控制启动日志中的登录链接，不限制访问地址
; - DSH_WEB_TOKEN：docker-compose 中配置的固定登录 token
; 包装脚本从 dsh 启动日志捕获本次真实随机 token，
; 写入 /run/dsh-web-token，供 dsh-proxy 完成固定 token 转换。
; 包装脚本最终执行的是：
; dsh web --no-open --host 127.0.0.1 --port 3081 --public-url <DSH_PUBLIC_URL>
; 不再需要 --trusted-host，因为代理会把每个请求的 Host 统一改写成回环地址。
command=/usr/local/bin/start-dsh-web.sh

; 启动服务前切换到项目目录，使 dsh 默认在持久化工作区中操作。
directory=/workspaces

; 优先级位于 sshd 和 OpenCode 之后，但早于 dsh-proxy。
; 启动时先保证 SSH 和 OpenCode 已开始运行，再启动资源占用较高的 dsh。
priority=30

; 容器启动时自动运行 DeepSeek Harness Web。
autostart=true

; dsh 进程退出后自动重启，保证 Web 服务长期可用。
autorestart=true

; 持续运行至少 10 秒才视为成功启动，给 dsh 初始化 profiles 和 Web 服务预留时间。
startsecs=10

; 如果启动后 10 秒内退出，最多连续尝试启动 5 次。
; 超过后进入 FATAL 状态；常见原因是 DSH_PUBLIC_URL 格式错误。
startretries=5

; 停止 dsh 时，把停止信号发送给整个进程组。
; dsh 可能启动终端、任务或其他子进程，这样可避免只停止父进程。
stopasgroup=true

; 停止超时后强制终止整个进程组，避免遗留孤儿子进程。
killasgroup=true

; 将 dsh 标准输出转发到容器标准输出。
; dsh 首次启动时会在这里打印带临时 token 的浏览器登录 URL。
stdout_logfile=/dev/fd/1

; 不使用 Supervisor 本地日志轮转，由 Docker 日志驱动统一管理。
; 如果日志被清理，需要重启 dsh 才能查看新的临时登录 URL。
stdout_logfile_maxbytes=0

; 将 dsh 标准错误转发到容器标准错误。
stderr_logfile=/dev/fd/2

; 不对标准错误进行本地文件轮转。
stderr_logfile_maxbytes=0

[program:dsh-proxy]
; 为 DeepSeek Harness 提供公开监听和请求头适配。
; dsh 本体拒绝监听 0.0.0.0，并校验 HTTP 的 Host/Origin。
; 这个 Node.js 代理负责：
; - 监听所有 IPv4 网卡的 3080 端口；
; - 把 Host 统一改写为 127.0.0.1:3081，满足 dsh 的信任围栏；
; - 删除浏览器传来的 Origin，避免它与改写后的 Host 不一致；
; - 转发普通 HTTP、SSE 流式响应、WebSocket 和远程 mux 长连接；
; - 把 dsh 返回的回环绝对跳转地址改写为相对路径；
; - 未登录时显示代理登录页，登录成功后自动注入 dsh 的真实 token。
; 因此浏览器使用任意服务器 IP、局域网 IP 或域名都可以访问，
; 因此不需要维护访问地址白名单。
; 代理不绕过 dsh 的临时 token 认证，但会增加一层密码/Token 登录页，
; 同时会放宽 dsh 的 Host 防护，所以 3080 只应暴露在可信网络中。
command=/usr/local/bin/node /usr/local/bin/dsh-proxy.cjs

; 代理只需要在项目目录中继承环境，不直接访问项目文件。
directory=/workspaces

; 优先级最高，因此最后启动、最先停止。
; 先让 dsh 进入 RUNNING 状态，再开放面向所有网卡的 3080 入口。
priority=40

; Supervisord 启动时自动创建公开监听。
autostart=true

; 代理退出后自动重启，避免 3080 入口消失。
autorestart=true

; 代理持续运行至少 5 秒才视为启动成功。
startsecs=5

; 连续启动失败 5 次后进入 FATAL 状态。
; 常见原因是 3080 已被容器内其他进程占用，或代理脚本存在语法错误。
startretries=5

; 停止代理时向整个进程组发送信号，确保长连接和子任务一起停止。
stopasgroup=true

; 停止超时后强制终止整个进程组，避免遗留连接。
killasgroup=true

; 将代理标准输出转发到容器标准输出。
stdout_logfile=/dev/fd/1

; 不使用本地日志轮转，由 Docker 日志驱动统一管理。
stdout_logfile_maxbytes=0

; 将代理标准错误转发到容器标准错误。
stderr_logfile=/dev/fd/2

; 不对标准错误进行本地文件轮转。
stderr_logfile_maxbytes=0

[program:kimi]
; 启动 Kimi Code CLI 的 Web UI。
; --host 0.0.0.0：监听所有容器网卡。
; --port 58627：容器内部端口，与 Dockerfile EXPOSE 一致；
; 宿主机通过 2226:58627 映射访问。
; --no-open：容器内没有桌面浏览器，禁止尝试自动打开浏览器。
; 运行时环境变量由 Compose 继承：
; - KIMI_CODE_HOME=/root/.kimi-code：持久化配置、登录态和会话。
; - KIMI_CODE_TOKEN：固定 bearer token，由包装脚本写入 server.token。
; - KIMI_CODE_PASSWORD：除 URL token 外的额外访问密码。
; - KIMI_CODE_DISABLE_HOST_CHECK=1：
;   关闭 Kimi 的 DNS 重绑定 Host 白名单检查，允许任意 IP/域名/IPv6 访问。
;   bearer token 和密码认证仍然生效，不能理解为关闭所有鉴权。
; 包装脚本把 KIMI_CODE_TOKEN 写入 /root/.kimi-code/server.token 后，
; 最终执行 kimi web --host 0.0.0.0 --port 58627 --no-open。
command=/usr/local/bin/start-kimi-web.sh

; 在持久化工作区中启动，使 Web 会话默认操作 /workspaces 下的项目。
directory=/workspaces

; 优先级最低，因此最后启动、最先停止。
; 先启动基础设施和代理，再启动 Kimi Web。
priority=50

; 容器启动时自动启动 Kimi Web。
autostart=true

; Kimi Web 退出后自动重启，保证服务长期可用。
autorestart=true

; 持续运行至少 10 秒才视为启动成功，给登录态和 Web 服务初始化预留时间。
startsecs=10

; 启动后 10 秒内退出时最多连续尝试 5 次。
; 常见原因是端口占用、KIMI_CODE_PASSWORD 设置异常或配置损坏。
startretries=5

; 停止时向整个进程组发送信号，确保 Kimi 创建的子进程一起停止。
stopasgroup=true

; 停止超时后强制终止整个进程组。
killasgroup=true

; 将 Kimi Web 标准输出转发到容器标准输出。
; 带 #token= 的浏览器访问地址会在这里打印。
stdout_logfile=/dev/fd/1

; 不使用 Supervisor 本地日志轮转，由 Docker 日志驱动统一管理。
stdout_logfile_maxbytes=0

; 将 Kimi Web 标准错误转发到容器标准错误。
stderr_logfile=/dev/fd/2

; 不对标准错误进行本地文件轮转。
stderr_logfile_maxbytes=0

[program:nocobase-runner]
; 启动 NocoBase 执行机（可选组件）。
; 镜像不预装 runner；使用者按 README 完成一次性注册后，本服务负责
; 开机自启和异常重启。runner 的程序、应用 CLI 和注册状态都位于
; Compose 挂载的宿主机目录中，容器重建后无需重新注册。
; 包装脚本会检查程序和注册凭据：未安装或未注册时以 0 正常退出，
; 因此不会在全新容器中反复重启，也不影响 Docker healthcheck。
command=/usr/local/bin/start-nocobase-runner.sh

; 与 OpenCode、DSH、Kimi 相同，在持久化工作区中启动。
directory=/workspaces

; 优先级最低，放在内置服务之后启动，避免和工具检测争抢启动时机。
priority=60

; 容器启动时自动尝试启动；未安装时脚本退出 0，Supervisor 会显示 EXITED。
autostart=true

; 0 = 未安装/未注册或正常停止，视为预期退出，不重启；
; 非 0（包括 runner 自动更新后的退出码 75）自动拉起。
autorestart=unexpected

; 持续运行至少 5 秒才视为启动成功。
startsecs=5

; 启动后 5 秒内异常退出时最多连续尝试 5 次，之后进入 FATAL 便于排查。
startretries=5

; 停止时向整个进程组发送信号，确保 runner 创建的子进程一起停止。
stopasgroup=true

; 停止超时后强制终止整个进程组。
killasgroup=true

; 将 runner 标准输出转发到容器标准输出。
stdout_logfile=/dev/fd/1

; 不使用 Supervisor 本地日志轮转，由 Docker 日志驱动统一管理。
stdout_logfile_maxbytes=0

; 将 runner 标准错误转发到容器标准错误。
stderr_logfile=/dev/fd/2

; 不对标准错误进行本地文件轮转。
stderr_logfile_maxbytes=0
